services:
  db:
    image: postgres:17-alpine
    container_name: tradejournal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradejournal
      POSTGRES_PASSWORD: tradejournal
      POSTGRES_DB: tradejournal
    ports:
      - "5432:5432"
    volumes:
      - tradejournal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradejournal -d tradejournal"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: tradejournal-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  tradejournal-pgdata:
